<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Can't connect</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: Canvas; color: CanvasText;
  }
  main { max-width: 420px; padding: 24px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 20px; opacity: .7; }
  button {
    font: inherit; font-weight: 600; padding: 9px 22px; border-radius: 8px; cursor: pointer;
    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: transparent; color: inherit;
  }
  small { display: block; margin-top: 18px; opacity: .45; }
</style>
</head>
<body>
<main>
  <h1>Can't connect</h1>
  <p>Check your internet connection, then try again.</p>
  <button id="retry">Try again</button>
  <small id="reason"></small>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const url = params.get("url");
  document.getElementById("reason").textContent = params.get("reason") || "";
  const retry = () => { if (url) location.href = url; };
  document.getElementById("retry").addEventListener("click", retry);
  window.addEventListener("online", retry);
</script>
</body>
</html>
